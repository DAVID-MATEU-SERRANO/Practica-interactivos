<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenis Inteligente - Móvil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Pantalla de Inicio (Overlay) -->
    <div id="start-overlay">
        <div class="overlay-content">
            <h1>CONTROLADOR 📱</h1>
            <p>Tenis Inteligente</p>
            <button id="btn-iniciar" class="btn-premium">CONECTAR SENSORES</button>
        </div>
    </div>

    <!-- Contenido del Móvil (Estatus de Sensor) -->
    <div id="mobile-content" style="display: none; height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="sensor-active-container">
            <div class="pulse-circle"></div>
            <h1 class="sensor-status-text">SENSOR ACTIVO</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">Enviando datos al portátil...</p>
            
            <div id="feedback-gesto" style="margin-top: 40px; font-weight: bold; min-height: 1.5em; text-align: center; color: var(--accent);"></div>
        </div>

        <!-- Elementos ocultos para MediaPipe y Voz -->
        <div style="display: none;">
            <div id="estado"></div>
            <div id="voice-label"></div>
            <video id="webcam" autoplay playsinline style="width: 480px; height: 360px;"></video>
            <canvas id="output_canvas" style="width: 480px; height: 360px;"></canvas>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/mobile.js"></script>
</body>

</html>

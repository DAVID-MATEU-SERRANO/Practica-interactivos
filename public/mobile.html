<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenis Inteligente - Móvil</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Pantalla de Inicio (Overlay) para activar sensores en el móvil -->
    <div id="start-overlay">
        <div class="overlay-content">
            <h1>CONTROLADOR 📱</h1>
            <p>Tenis Inteligente</p>
            <button id="btn-iniciar">CONECTAR SENSORES</button>
        </div>
    </div>

    <!-- Contenido del Móvil (Oculto hasta pulsar Iniciar) -->
    <div id="mobile-content" style="display: none; padding: 20px; text-align: center;">
        <h1>Controlador Móvil</h1>
        
        <!-- Indicador de Asistente de Voz -->
        <div id="voice-status" class="status-indicator">
            🎤 Escuchando comandos: <span id="voice-label">Iniciando...</span>
        </div>

        <button onclick="cambiarModo('MODO PARTIDO')">MODO PARTIDO</button>
        <button onclick="cambiarModo('MODO ENTRENAMIENTO')">MODO ENTRENAMIENTO</button>

        <!-- Selección de Saque Inicial (Solo al empezar partido) -->
        <div id="seccion-saque" style="display: none; margin-top: 20px; text-align: center;">
            <h3 style="color: var(--gold); border: 2px solid var(--gold); padding: 20px; border-radius: 15px;">
                🎤 Diga "YO" o "RIVAL" para el saque inicial
            </h3>
        </div>

        <!-- Controles de Modo Partido (Gestos) -->
        <div id="controles-partido" style="display: none; margin-top: 20px; border-top: 1px solid #ccc; padding-top: 20px; text-align: center;">
            <div id="guia-gestos" class="glass" style="padding: 20px; border-radius: 15px; margin-top:10px;">
                <p style="font-size: 0.9rem; color: #aaa;">GESTOS DE PUNTUACIÓN (HACIA ABAJO):</p>
                <div style="display: flex; justify-content: space-around; margin-top: 10px;">
                    <div>
                        <h2 style="color: var(--success-color); margin:0;">↓↓</h2>
                        <p style="font-size: 0.8rem;">PK YO (2 tirones)</p>
                    </div>
                    <div>
                        <h2 style="color: var(--error-color); margin:0;">↓↓↓</h2>
                        <p style="font-size: 0.8rem;">PK RIVAL (3 tirones)</p>
                    </div>
                </div>
                <p id="feedback-gesto" style="margin-top: 15px; font-weight: bold; min-height: 1.2em;"></p>
            </div>
        </div>

        <p id="estado">Estado: Desconectado</p>
        <button id="pingButton">Enviar Ping (Prueba)</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/mobile.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenis Inteligente - Móvil</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Controlador Móvil</h1>
    
    <!-- Indicador de Asistente de Voz -->
    <div id="voice-status" class="status-indicator">
        🎤 Escuchando comandos: <span id="voice-label">Iniciando...</span>
    </div>

    <button onclick="cambiarModo('MODO PARTIDO')">MODO PARTIDO</button>
    <button onclick="cambiarModo('MODO ENTRENAMIENTO')">MODO ENTRENAMIENTO</button>

    <!-- Selección de Saque Inicial (Solo al empezar partido) -->
    <div id="seccion-saque" style="display: none; margin-top: 20px; text-align: center;">
        <h3>¿Quién saca primero?</h3>
        <button class="btn-punto" id="btn-saque-yo">SACA YO</button>
        <button class="btn-punto" id="btn-saque-rival">SACA RIVAL</button>
    </div>

    <!-- Controles de Modo Partido (Ocultos inicialmente) -->
    <div id="controles-partido" style="display: none; margin-top: 20px; border-top: 1px solid #ccc; padding-top: 20px;">
        <h3>Anotar Punto</h3>
        <button class="btn-punto" id="btn-punto-yo">PUNTO YO</button>
        <button class="btn-punto" id="btn-punto-rival">PUNTO RIVAL</button>
    </div>

    <p id="estado">Estado: Desconectado</p>
    <button id="pingButton">Enviar Ping (Prueba)</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/mobile.js"></script>
</body>

</html>
